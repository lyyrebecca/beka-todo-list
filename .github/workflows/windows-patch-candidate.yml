name: Build Windows patch candidate (Draft only)
on:
  workflow_dispatch:
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-patch-candidate.yml"]
permissions: { contents: write }
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  WINAPP_CLI_TELEMETRY_OPTOUT: 1
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test windows/LiquidTodo.Windows.sln -c Release --logger "trx;LogFileName=windows.trx" --results-directory evidence/unit-tests
      - run: dotnet publish windows/src/LiquidTodo.Windows -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o windows/publish
      - name: Build and verify actual Setup and Portable candidate
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          iscc /DMyAppVersion=2.0.2 windows/installer/LiquidTodo.iss
          New-Item -ItemType Directory -Force release/portable | Out-Null
          Copy-Item windows/publish/* release/portable -Recurse -Force
          New-Item release/portable/portable.flag -ItemType File | Out-Null
          Copy-Item windows/portable/README-Windows.txt, LICENSE release/portable
          ./windows/scripts/New-PortableManifest.ps1 -PublishDirectory release/portable -OutputFile release/portable/manifest.json -Version 2.0.2
          Compress-Archive release/portable/* release/LiquidTodo-Windows-x64-Portable-v2.0.2.zip
          ./windows/scripts/Test-PortablePackage.ps1 -PackagePath release/LiquidTodo-Windows-x64-Portable-v2.0.2.zip -LaunchSmokeTest -RunUiSmokeTest
          ./windows/scripts/Test-InstallerPackage.ps1 -InstallerPath release/LiquidTodo-Windows-x64-Setup-v2.0.2.exe
          Expand-Archive release/LiquidTodo-Windows-x64-Portable-v2.0.2.zip "$env:RUNNER_TEMP/orb-final-package"
          ./windows/scripts/Test-WindowInteractions.ps1 -ExecutablePath "$env:RUNNER_TEMP/orb-final-package/LiquidTodo.exe" -EvidenceDirectory evidence/orb-final -Cycles 100
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: Windows-v2.0.2-acceptance-evidence, path: evidence }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-v2.0.2-candidate
          path: |
            release/LiquidTodo-Windows-x64-Setup-v2.0.2.exe
            release/LiquidTodo-Windows-x64-Portable-v2.0.2.zip
  draft:
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Windows-v2.0.2-candidate, path: assets }
      - name: Mirror unchanged verified macOS asset
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir old-mac
          gh release download v2.0.1 --repo '${{ github.repository }}' --pattern 'LiquidTodo-macOS-universal-v2.0.1.zip' --pattern SHA256SUMS.txt --dir old-mac
          (cd old-mac && grep 'LiquidTodo-macOS-universal-v2.0.1.zip' SHA256SUMS.txt | sha256sum --check)
          cp old-mac/LiquidTodo-macOS-universal-v2.0.1.zip assets/
          test "$(find assets -maxdepth 1 -type f | wc -l)" -eq 3
          (cd assets && sha256sum LiquidTodo-* > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          target_commitish: ${{ github.sha }}
          name: v2.0.2 Windows 修复候选版（验收中）
          draft: true
          body_path: windows/qa/v2.0.2-release-notes.md
          files: assets/*
