name: Publish macOS package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to mirror into GitHub Packages
        required: true
        default: v1.4.3

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.version }}" --repo "${{ github.repository }}" --pattern 'LiquidTodo-macOS-universal-*.zip'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish package mirror
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/beka-todo-list
        run: |
          cat > Dockerfile.package <<'DOCKERFILE'
          FROM scratch
          LABEL org.opencontainers.image.title="贝卡の Todo list"
          LABEL org.opencontainers.image.description="Universal macOS download package mirror"
          LABEL org.opencontainers.image.source="https://github.com/lyyrebecca/beka-todo-list"
          COPY LiquidTodo-macOS-universal-*.zip /downloads/
          DOCKERFILE
          docker buildx build --platform linux/amd64 --push \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" -f Dockerfile.package .
