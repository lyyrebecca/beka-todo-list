name: macOS native initial input focus
on:
  workflow_dispatch:
  pull_request:
    paths: ["Sources/**", "Tests/**", "Info.plist", "build.sh", "test.sh", ".github/workflows/macos-ime-focus.yml"]
permissions: { contents: read }
jobs:
  native-focus:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Data and interaction regression
        run: ./test.sh
      - name: Native menu bar presentation regression
        run: ./Tests/run-status-item-tests.sh
      - name: Native bounded list and archive layout regression
        run: ./Tests/run-layout-tests.sh "$RUNNER_TEMP/layout-evidence"
      - name: Universal build and signature verification
        run: ./build.sh
      - name: Native delayed attachment and no focus stealing regression
        run: ./Tests/run-ime-focus-tests.sh "$RUNNER_TEMP/ime-focus-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-native-focus-evidence
          path: |
            ${{ runner.temp }}/ime-focus-evidence/results.json
            ${{ runner.temp }}/layout-evidence/results.json
